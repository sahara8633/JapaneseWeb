<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히라가나 매일 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem('kana-theme');if(t==='light'||t==='dark'||t==='mix')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<section class="top">
 <div class="wrap">
  <div class="head">
   <h1>히라가나 매일 연습</h1>
   <div class="tools">
    <div class="sw mini" id="themeSw" role="group" aria-label="화면 테마">
     <button type="button" data-v="light">라이트</button><button type="button" data-v="dark">다크</button><button type="button" data-v="mix">라이트다크</button>
    </div>
    <div class="acct" id="acct" hidden>
     <button type="button" class="acctBtn" id="loginBtn"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>로그인</button>
     <span class="me" id="me" hidden><i id="meAva" aria-hidden="true"></i><span id="meName"></span><button type="button" class="acctBtn ghost" id="logoutBtn">로그아웃</button></span>
    </div>
   </div>
  </div>
  <div class="bar2">
   <div class="sw onField" id="tabs" role="tablist" aria-label="화면">
    <button type="button" role="tab" id="tPractice" aria-controls="pPractice" aria-selected="true">연습</button><button type="button" role="tab" id="tRecords" aria-controls="pRecords" aria-selected="false">기록</button>
   </div>
   <div class="streak"><div><b id="sStreak">0일</b>연속</div><div><b id="sToday">0</b>오늘 푼 문제</div></div>
  </div>
  <div class="grid" id="pPractice" role="tabpanel" aria-labelledby="tPractice">
   <div class="card" id="card">
    <div class="bar" id="bar" style="width:0"></div>
    <div class="cardTop"><span id="cTL">오늘의 글자</span><span id="cTR"></span></div>
    <div class="kana" id="kana" lang="ja">ぬ</div>
    <div class="cardBot" id="cBot">누</div>
    <div class="stamp" id="stamp">다시</div>
   </div>

   <div class="side" id="vSetup">
    <div>
     <div class="lab">글자</div>
     <div class="sw" id="kSw" role="group" aria-label="출제할 글자">
      <button type="button" data-v="h">히라가나</button><button type="button" data-v="k">가타카나</button><button type="button" data-v="mix">섞어서</button>
     </div>
    </div>
    <div>
     <div class="lab">문제 범위</div>
     <div class="tiles">
      <button type="button" class="tile" data-o="base"><i class="ck" aria-hidden="true"></i><b lang="ja">あ</b><span>기본 글자</span><small>46자</small></button>
      <button type="button" class="tile" data-o="dak"><i class="ck" aria-hidden="true"></i><b lang="ja">が</b><span>탁점·반탁점</span><small>25자</small></button>
      <button type="button" class="tile" data-o="yoon"><i class="ck" aria-hidden="true"></i><b lang="ja">きゃ</b><span data-h="작은 ゃゅょ">작은 ゃゅょ</span><small>33자</small></button>
     </div>
    </div>
    <div>
     <div class="lab">문제 수</div>
     <div class="seg" id="nSeg">
      <span class="nBtns" id="nBtns"></span>
      <input id="nIn" type="number" min="1" max="200" inputmode="numeric" aria-label="문제 수 직접 입력" placeholder="직접">
     </div>
    </div>
    <div>
     <div class="lab">답하는 방법</div>
     <div class="sw" id="mSw" role="group" aria-label="답하는 방법">
      <button type="button" data-v="pick">보기에서 고르기</button><button type="button" data-v="type">직접 쓰기</button>
     </div>
    </div>
    <button class="go" id="start" type="button">시작하기</button>
   </div>

   <div class="side" id="vQuiz" hidden>
    <h2>이 글자는 뭐라고 읽을까요?</h2>
    <div class="opts" id="opts"></div>
    <form class="typeAns" id="typeForm" hidden autocomplete="off">
     <input id="typeIn" type="text" aria-label="읽는 법" placeholder="한글로 적기" autocomplete="off" spellcheck="false">
     <button class="go" type="submit">확인</button>
    </form>
    <div class="msg" id="msg">숫자 키 1~4로도 고를 수 있어요.</div>
    <div class="row2"><button class="go alt" id="quit" type="button">그만하기</button><button class="go" id="next" type="button" hidden>다음</button></div>
   </div>

   <div class="side" id="vDone" hidden>
    <h2 id="dTitle">끝!</h2>
    <div><div class="lab" id="dWrongLab">틀린 글자</div><div class="chips" id="dWrong"></div></div>
    <div class="row2"><button class="go" id="retry" type="button">틀린 것만 다시</button><button class="go alt" id="again" type="button">처음으로</button></div>
   </div>
  </div>
 </div>
</section>

<section class="below" id="pRecords" role="tabpanel" aria-labelledby="tRecords" hidden>
 <div class="wrap">
  <h2>이번 주 기록</h2>
  <p id="syncMsg">기록은 이 브라우저에 저장돼요.</p>
  <div class="week" id="week"></div>
  <h2 style="margin-top:30px">자주 틀린 글자</h2>
  <div class="chips" id="misses"></div>
  <h2 style="margin-top:30px">기록 옮기기</h2>
  <p>다른 브라우저로 옮길 때: 여기서 '기록 복사'를 누르고, 새 브라우저에서 이 칸에 붙여 넣은 뒤 '불러오기'를 누르세요. 두 기록이 합쳐져요.</p>
  <div class="move"><textarea id="moveTxt" rows="3" aria-label="기록 코드" placeholder="기록 코드를 여기에 붙여 넣으세요"></textarea>
  <div class="row2" style="max-width:420px"><button class="go alt" id="exp" type="button">기록 복사</button><button class="go alt" id="imp" type="button">불러오기</button></div>
  <div class="msg" id="moveMsg"></div></div>
 </div>
</section>
<script src="script.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
